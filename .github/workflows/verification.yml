name: Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run hardware / e2e-device gates (physical outputs required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  AURALIS_STRESS_ITERATIONS: "100000"

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-suffix: preflight
          cache-swift: "false"
      - name: Generate Xcode project and list schemes
        run: |
          xcodegen generate
          xcodebuild -list -project Auralis.xcodeproj

  verify:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: strict-concurrency
            gate: strict
            timeout-minutes: 25
          - name: thread-sanitizer
            gate: tsan
            timeout-minutes: 40
          - name: address-sanitizer
            gate: asan
            timeout-minutes: 40
          - name: undefined-behavior-sanitizer
            gate: ubsan
            timeout-minutes: 40
          - name: sustained-audio-stress
            gate: stress
            timeout-minutes: 25
          - name: generated-xcode-products
            gate: xcode
            timeout-minutes: 40
          - name: coverage
            gate: coverage
            timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-suffix: ${{ matrix.gate }}
      - name: Run ${{ matrix.gate }}
        run: Scripts/run-verification.sh ${{ matrix.gate }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}-logs
          path: |
            .build/logs
            **/*.xcresult
          if-no-files-found: ignore

  # Hardware / live Core Audio HAL tests. Off by default so PR CI stays green
  # without devices. Enable with workflow_dispatch input run_hardware, or by
  # labeling a PR `hardware` or `e2e-device`.
  # Signed/Developer ID product tests stay off hosted CI (no distribution cert).
  hardware:
    name: hardware
    needs: preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_hardware) ||
      (github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'hardware') ||
         contains(github.event.pull_request.labels.*.name, 'e2e-device')))
    runs-on: macos-15
    timeout-minutes: 25
    env:
      AURALIS_HW_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-suffix: hardware
      - name: Hardware preflight
        run: Scripts/run-verification.sh hardware
      - name: Live Core Audio HAL tests
        run: swift test --filter CoreAudioHardwareTests
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardware-logs
          path: |
            .build/logs
            **/*.xcresult
          if-no-files-found: ignore
